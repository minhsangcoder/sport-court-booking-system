x-backend-env: &backend-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  IDENTITY_SERVICE_URL: http://identity-service:8081
  FACILITY_SERVICE_URL: http://facility-service:8082
  SCHEDULE_SERVICE_URL: http://schedule-service:8083
  BOOKING_SERVICE_URL: http://booking-service:8084
  PAYMENT_SERVICE_URL: http://payment-service:8085
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
  JAVA_TOOL_OPTIONS: -Xmx256m

name: ${COMPOSE_PROJECT_NAME:-sporthub}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sporthub]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sporthub]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: sporthub
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [sporthub]

  minio:
    # MinIO CE is source-only now; this multi-arch image is rebuilt from the
    # corresponding upstream release and pinned by digest for reproducibility.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [sporthub]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [sporthub]

  identity-service:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: identity-service
    environment:
      <<: *backend-env
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      MAIL_HOST: mailpit
      DEMO_SMS_ENABLED: ${DEMO_SMS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  facility-service:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: facility-service
    environment:
      <<: *backend-env
      FACILITY_DB_URL: jdbc:postgresql://postgres:5432/facility_db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  schedule-service:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: schedule-service
    environment:
      <<: *backend-env
      SCHEDULE_DB_URL: jdbc:postgresql://postgres:5432/schedule_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      facility-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  booking-service:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: booking-service
    environment:
      <<: *backend-env
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/booking_db
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      GROUP_PAYMENT_DEADLINE_SECONDS: ${GROUP_PAYMENT_DEADLINE_SECONDS:-1800}
      GROUP_MIN_LEAD_SECONDS: ${GROUP_MIN_LEAD_SECONDS:-7200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      facility-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  payment-service:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: payment-service
    environment:
      <<: *backend-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DEMO_PAYMENT_CALLBACK_SECRET: ${DEMO_PAYMENT_CALLBACK_SECRET:?Set a separate demo callback secret}
      DEMO_PAYMENT_CALLBACK_URL: http://payment-service:8085/api/v1/payments/providers/demo/callback
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  api-gateway:
    profiles: [apps]
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    environment:
      <<: *backend-env
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      facility-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [sporthub]

  frontend:
    profiles: [apps]
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://api-gateway:8080
        NEXT_PUBLIC_DEMO_MAILPIT_URL: ${NEXT_PUBLIC_DEMO_MAILPIT_URL:-}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [sporthub]

networks:
  sporthub:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
