# ═══════════════════════════════════════════════════════════════
# SportHub Identity & Access Service — Configuration
# ═══════════════════════════════════════════════════════════════

server:
  port: 8081

spring:
  application:
    name: identity-service

  # ── PostgreSQL (identity_db) ────────────────────────────────
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway (Database Migrations) ────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  # ── RabbitMQ ────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:sporthub}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

sporthub:
  identity:
    verification-expiration-minutes: ${VERIFICATION_EXPIRATION_MINUTES:15}
    password-reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:no-reply@sporthub.local}
    secure-cookie: ${SECURE_COOKIE:false}
    demo-sms-enabled: ${DEMO_SMS_ENABLED:false}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}

# ── JWT Configuration ─────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutes (ms)
  refresh-token-expiration: 604800000  # 7 days (ms)

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.sporthub: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
