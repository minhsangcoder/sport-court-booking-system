            "format": "uuid"
          },
          "facilityId": {
            "type": "string",
            "format": "uuid"
          },
          "courtId": {
            "type": "string",
            "format": "uuid"
          },
          "venue": {
            "$ref": "#/components/schemas/Venue"
          },
          "originalAmount": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true
          },
          "price": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true
          },
          "currency": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "deadline": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "LOCKED",
              "COMPLETED",
              "WITHDRAWN",
              "EXPIRED",
              "PENDING_AUDIT"
            ]
          },
          "own": {
            "type": "boolean"
          },
          "available": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "id",
          "facilityId",
          "courtId",
          "venue",
          "originalAmount",
          "price",
          "currency",
          "startsAt",
          "endsAt",
          "deadline",
          "state",
          "own",
          "available",
          "version"
        ]
      },
      "Acquisition": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "listingId": {
            "type": "string",
            "format": "uuid"
          },
          "bookingId": {
            "type": "string",
            "format": "uuid"
          },
          "buyerId": {
            "type": "string",
            "format": "uuid"
          },
          "amount": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true
          },
          "currency": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING",
              "PENDING_HANDOFF",
              "SUCCESS",
              "CANCELLED",
              "EXPIRED",
              "FAILED",
              "PENDING_AUDIT"
            ]
          },
          "paymentId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          }
        },
        "required": [
          "id",
          "listingId",
          "bookingId",
          "buyerId",
          "amount",
          "currency",
          "expiresAt",
          "state",
          "paymentId"
        ]
      },
      "CreateListing": {
        "type": "object",
