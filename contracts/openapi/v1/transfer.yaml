          "401": {
            "description": "Invalid session"
          },
          "403": {
            "description": "Outside actor scope"
          },
          "404": {
            "description": "Resource not found"
          },
          "409": {
            "description": "Conflict or BLOCKED_RULE"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100,
              "pattern": "^[A-Za-z0-9_.:-]+$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateListing"
              }
            }
          }
        },
        "description": "New commands use PEER_RESALE_V1 only, funded by an eligible original REAL booking. Full P is paid directly B to A via SePay; no facility fee or Owner payout. DEMO and legacy creation/edit are rejected; history and already-open transactions remain recoverable."
      }
