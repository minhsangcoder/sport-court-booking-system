    "/transfers/conversations/{id}/messages": {
      "get": {
        "operationId": "getPeerMessages",
        "description": "Without a cursor, returns the latest page in ascending cursor order. Use after for new messages or before for older history; the two cursors are mutually exclusive.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
