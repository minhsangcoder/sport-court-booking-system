              "format": "uuid"
            }
          },
          {
            "name": "after",
            "in": "query",
            "description": "Read messages newer than this cursor; after=0 explicitly reads from the beginning.",
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            }
          },
          {
            "name": "before",
            "in": "query",
            "description": "Read the nearest older page before this cursor, returned in ascending order. Cannot be combined with after.",
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 1
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
