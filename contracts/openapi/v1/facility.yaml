    "title": "SportHub Facility API",
    "version": "1.0.0",
    "description": "Owner-scoped facility/court/media/maintenance operations, additional-facility review with retained private legal documents, and public discovery metadata. No implicit activation on CRUD. First-facility Owner application remains a separate pending capability. First-facility applicants may read/edit only their Identity-scoped application facility while DRAFT or supplement is open. Pending/rejected profiles are frozen. Prepared first facilities remain private until Identity commits APPROVED. Submit/review linked first facilities through Owner Application APIs. Facility/public projections never include receiving-channel credentials, webhook keys or ciphertext. Configure credentials only through write-only Payment channel API."
  },
