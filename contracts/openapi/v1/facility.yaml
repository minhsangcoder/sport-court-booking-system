        "description": "Location is a paired optional value. On PUT, omitting both latitude and longitude preserves the stored location; supply both numeric values to replace it, or both null to clear it (existing nullable location semantics). One missing/null coordinate is invalid. Values use existing NUMERIC(10,7) storage precision. Address text is independent of map coordinates. Backend ownership/applicant and publication guards apply; STAFF alone grants no edit access. Vietnam addresses use province/city and commune/ward only. The backend validates codes and their relationship against the current Open Admin Data dataset and stores the canonical display names; selecting another province requires a new ward selection."
      },
