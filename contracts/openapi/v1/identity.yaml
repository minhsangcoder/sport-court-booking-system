    "schemas": {
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "fullName",
          "password"
        ],
        "anyOf": [
          {
            "required": [
              "email"
            ]
          },
          {
            "required": [
              "phone"
            ]
          }
        ],
        "properties": {
          "fullName": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254
          },
          "phone": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{7,14}$"
          },
          "password": {
            "$ref": "#/components/schemas/NewPassword"
          }
        }
      },
      "VerificationRequest": {
        "type": "object",
        "additionalProperties": false,
        "oneOf": [
          {
            "required": [
              "verificationToken"
            ]
          },
          {
            "required": [
              "challengeId",
              "code"
            ]
          }
        ],
        "properties": {
          "verificationToken": {
            "type": "string",
            "minLength": 32,
            "maxLength": 2048
          },
          "challengeId": {
            "type": "string",
            "format": "uuid"
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "identifier",
          "password"
        ],
        "properties": {
          "identifier": {
            "type": "string",
            "minLength": 3,
            "maxLength": 254,
            "description": "Registered email address or E.164 phone number."
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 72
          }
        }
      },
      "ForgotPasswordRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "identifier"
        ],
        "properties": {
          "identifier": {
            "type": "string",
            "minLength": 3,
            "maxLength": 254,
