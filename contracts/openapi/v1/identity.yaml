  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "JWT access token with a 15-minute lifetime; held in frontend memory."
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sporthub_refresh",
        "description": "Rotating refresh token cookie with a 7-day lifetime."
      }
    },
    "parameters": {
      "CorrelationId": {
        "name": "X-Correlation-Id",
        "in": "header",
        "required": false,
        "description": "Optional caller correlation ID; the Gateway generates one when absent or unsafe.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._-]+$"
        }
      },
      "BindingId": {
        "name": "bindingId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "headers": {
      "CorrelationId": {
        "description": "Correlation ID propagated through the request.",
        "schema": {
          "type": "string"
        }
      },
      "RefreshCookie": {
        "description": "`sporthub_refresh` cookie. Local HTTP development uses `HttpOnly; SameSite=Lax; Secure=false`.\nHTTPS environments must use `HttpOnly; SameSite=Lax; Secure=true`. Max-Age is 604800 seconds.\n",
        "schema": {
          "type": "string"
        }
      }
    },
    "responses": {
      "BadRequest": {
