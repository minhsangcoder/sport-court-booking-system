            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_.:-]{1,100}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/SepayChannel"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "403": {
            "description": "Outside current role/facility scope"
          },
          "409": {
            "description": "Stale version or conflicting command"
          },
          "503": {
            "description": "Dependency unavailable; no simulation fallback"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SepayChannelInput"
              }
            }
          }
        },
        "description": "Current facility OWNER only. Immutable encrypted receiver revision and write-only API key. Configure the same key on the SePay incoming-money webhook; no QR or browser action certifies money."
      }
    },
    "/payments/providers/sepay/{channelId}/webhook": {
      "post": {
        "operationId": "receiveSepayWebhook",
        "security": [],
        "description": "API Key authentication, exact immutable receiver/account/bank/memo binding and durable SePay ID plus bank reference deduplication are required. Initial booking money only; never completes a P2P acquisition. 200 success only after commit.",
        "parameters": [
          {
            "name": "channelId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "writeOnly": true
            },
            "description": "Apikey followed by the channel webhook secret; never logged."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NativeSepayWebhook"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durably recorded or idempotent duplicate",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success"
                  ],
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "enum": [
                        true
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid native notice"
          },
          "403": {
            "description": "Webhook secret does not match the receiver revision"
          },
          "503": {
            "description": "Not committed; SePay must retry"
          }
        }
      }
    },
    "/payments/{id}/counter-cash": {
      "post": {
        "operationId": "collectCounterCash",
        "summary": "Ghi nhận đã nhận đủ tiền mặt tại quầy",
        "description": "Original counter operator only, with current facility permissions. Idempotent by original payment ID. Rejects expired, settled or partially bank-funded obligations. Late bank transfers remain unapplied.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/Payment"
                    },
                    "timestamp": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "status",
                    "message",
                    "data",
                    "timestamp"
                  ]
                }
              }
            }
          },
          "403": {
            "description": "No current counter permission"
          },
          "409": {
            "description": "Already collected, expired or bank credits exist"
          }
        }
      }
    },
    "/payments/group-claims": {
      "get": {
        "operationId": "getGroupContributionClaims",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "bookingId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "memberId",
            "in": "query",
