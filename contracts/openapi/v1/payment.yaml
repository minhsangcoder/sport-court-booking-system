            "schema": {
              "type": "array",
              "maxItems": 50,
              "items": {
                "type": "string",
                "format": "uuid"
              }
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Open QR per contribution; a member with another payer's open QR must not pay",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "memberId",
                          "paidByCaller"
                        ],
                        "properties": {
                          "memberId": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "paidByCaller": {
                            "type": "boolean"
                          }
                        }
                      }
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Invalid session"
          }
        }
      }
    }
  },
