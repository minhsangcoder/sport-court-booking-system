    "/bookings/search": {
      "get": {
        "tags": [
          "Booking"
        ],
        "operationId": "searchPublicCourtAvailability",
        "summary": "Search approved enabled courts using real available slots and prices",
        "description": "Read-only aggregation: Facility owns location/category metadata; Schedule owns hours/pricing; Booking excludes reservations. AND filters. Returns 503 when a dependency is unavailable rather than false empty results. No holds or price snapshots are created.",
        "security": [],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 180
            }
          },
          {
            "name": "provinceCode",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 2,
              "maxLength": 2,
              "pattern": "^[0-9]{2}$",
              "description": "Current Vietnam province/city code from Open Admin Data. Keep leading zeroes."
            },
            "description": "Filter by the selected current province/city code, rather than free-form display text."
          },
          {
            "name": "sportCategoryId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "date",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "description": "Defaults to today in Asia/Ho_Chi_Minh; within configured booking.advance-days."
          },
          {
            "name": "opensAfter",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-2][0-9]:[0-5][0-9]$"
            },
            "description": "Whole available slots inside the local facility time window; not a reservation."
          },
          {
            "name": "closesBefore",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-2][0-9]:[0-5][0-9]$"
            },
            "description": "Whole available slots inside the local facility time window; not a reservation."
          },
          {
            "name": "minPrice",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0
            },
            "description": "Price for each matching slot in VND, not a total multi-slot quote."
          },
          {
            "name": "maxPrice",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0
            },
            "description": "Price for each matching slot in VND, not a total multi-slot quote."
          },
          {
            "name": "latitude",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": -90,
              "maximum": 90
            }
          },
          {
            "name": "longitude",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": -180,
              "maximum": 180
            }
          },
          {
            "name": "radiusKm",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0,
              "exclusiveMinimum": true,
              "maximum": 500
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "NAME",
                "PRICE_ASC",
                "PRICE_DESC",
                "DISTANCE"
              ],
              "default": "NAME"
            },
            "description": "Distance requires both origin coordinates."
          }
        ],
        "responses": {
          "200": {
            "description": "Available courts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DiscoverySearchResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid text/date/time/price/coordinate/sort criteria"
          },
          "503": {
            "description": "Upstream search or availability data temporarily unavailable"
          }
        }
      }
    },
    "/groups/{id}/payment-reminders": {
      "post": {
        "operationId": "sendGroupPaymentReminders",
        "tags": [
          "Group Booking"
        ],
        "summary": "Booking Owner manually reminds unpaid other members",
        "description": "UC-6.7. Group owner ID only; Facility OWNER/STAFF has no override. Requires allocated GROUP_PENDING/PENDING before contribution deadline. Under payment/expiry lock, paid, inactive, self and cooldown members are skipped individually. All mode examines current active other members. Timestamp/history/outbox commit atomically. Enqueue failure rolls back the batch for retry. 200 means accepted into Booking outbox, not delivered; existing broker/contact delivery retries handle later failures. No financial mutation.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PaymentReminderSelection"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Per-member acceptance/skip, including paid-race and cooldown with server nextReminderAt.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/PaymentReminderResult"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid/ambiguous/empty selection, duplicate/null IDs or malformed UUID"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Only this Booking Owner may send"
          },
          "404": {
            "description": "Group not found"
          },
          "409": {
            "description": "Contribution window/state closed or costs not allocated"
          },
          "503": {
            "description": "Outbox acceptance failed; batch rolled back, retry permitted"
          }
        }
      }
    },
    "/bookings/reports/facility/{id}/dashboard": {
      "get": {
        "operationId": "ownerFacilityDashboard",
        "summary": "Owner facility dashboard",
        "description": "Current scoped OWNER only. REAL defaults in LIVE; DEMO remains a separate read cohort. R applied court money at paidAt, native cash at bankTime, F committed handoffAt, N/H outgoing at manually recorded confirmedAt. R+F and R+F-H are facility figures; P and seller payout remain separate cashflow. One inclusive facility IANA date range, max366 dates. Partial/missing source is explicit; no network under local snapshot. Due balance cutoff=min(endExclusive,asOf). PEER_RESALE_V1 is returned in peer with its own bounded page and assurance, never included in facility R/F/P/N/H cashflow. Original LEGACY_OWNER terms are preserved.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "fromDate",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date"
            },
            "description": "Inclusive facility calendar date. Supply both dates or neither; defaults to today and six previous dates."
          },
          {
            "name": "toDate",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date"
            },
            "description": "Inclusive facility calendar date; max 366 calendar dates, UTC bounds [from,to). Browser timezone is not used."
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          },
          {
            "name": "mode",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "REAL",
                "DEMO"
              ]
            },
            "description": "Server defaults REAL in LIVE; cohorts are never combined."
          },
          {
            "name": "peerPage",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            },
            "description": "Independent direct peer transaction page, using the same size/date/facility/mode."
          }
        ],
        "responses": {
          "200": {
            "description": "Scoped facility report with REAL/DEMO mode and evidence coverage.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/DemoFacilityDashboard"
                    },
                    "timestamp": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "status",
                    "message",
                    "data",
                    "timestamp"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid date pair, date range longer than 366 calendar dates, page or size"
          },
          "401": {
            "description": "Invalid or revoked session"
          },
          "403": {
            "description": "Facility is outside ownership"
          },
          "503": {
            "description": "Ownership cannot be verified"
          }
        }
      }
    },
