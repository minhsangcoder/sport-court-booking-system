            "format": "date-time",
            "nullable": true,
            "description": "Server/config derived earliest next acceptance."
          },
          "reminderEligible": {
            "type": "boolean",
            "description": "Current server eligibility; submission revalidates under the payment lock."
          },
          "reminderBlockedReason": {
            "type": "string",
            "nullable": true,
            "enum": [
              "SELF",
              "WINDOW_CLOSED",
              "NO_ALLOCATION",
              "PAID",
              "COOLDOWN",
              "NOT_MEMBER"
            ]
          }
        }
      },
      "Group": {
        "type": "object",
        "required": [
          "id",
          "ownerId",
          "name",
          "state",
          "deadline",
          "maxMembers",
          "allocationsLocked",
          "booking",
          "members",
          "totalPaid"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "ownerId": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "GROUP_PENDING",
              "CONFIRMED",
              "GROUP_EXPIRED",
              "GROUP_CANCELLED"
            ]
          },
          "deadline": {
            "type": "string",
            "format": "date-time"
          },
          "maxMembers": {
            "type": "integer"
          },
          "allocationsLocked": {
            "type": "boolean"
          },
          "booking": {
            "$ref": "#/components/schemas/Booking"
          },
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/GroupMember"
            }
          },
          "totalPaid": {
            "type": "number",
            "minimum": 0
          }
        }
      },
      "GroupInvite": {
        "type": "object",
        "required": [
          "code",
          "path",
          "qrSvg",
          "expiresAt"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "path": {
            "type": "string"
          },
          "qrSvg": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "qrPngDataUrl": {
            "description": "640px PNG data URL for downloading and scanning the invitation",
            "type": "string"
          }
        }
      },
      "GroupAllocation": {
        "type": "object",
        "required": [
          "memberId",
          "amount"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "amount": {
            "type": "number",
            "minimum": 0,
            "multipleOf": 1
          }
        }
      },
      "GroupSplit": {
        "type": "object",
        "required": [
          "mode"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "EQUAL",
              "CUSTOM"
            ]
          },
          "allocations": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/GroupAllocation"
            },
            "nullable": true
          }
        }
      },
      "DiscoveryFacilitySummary": {
        "type": "object",
        "required": [
          "id",
          "name",
          "addressLine",
          "province",
          "district",
          "ward",
          "timezone",
          "latitude",
          "longitude",
          "amenities"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "addressLine": {
            "type": "string"
          },
          "province": {
            "type": "string"
          },
          "district": {
            "type": "string"
          },
          "ward": {
            "type": "string"
          },
          "timezone": {
            "type": "string"
          },
          "latitude": {
            "type": "number",
            "nullable": true
          },
          "longitude": {
            "type": "number",
            "nullable": true
          },
          "amenities": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "description": "Only public facility fields; no owner/staff/customer identifiers or personal contacts."
      },
      "DiscoveryResult": {
        "type": "object",
        "required": [
          "facility",
          "courtId",
          "courtName",
          "sportCategoryId",
          "sportName",
          "date",
          "fromPrice",
          "currency",
          "availableSlots",
          "firstStartsAt",
          "firstEndsAt",
          "distanceKm"
        ],
        "properties": {
          "facility": {
            "$ref": "#/components/schemas/DiscoveryFacilitySummary"
          },
          "courtId": {
            "type": "string",
            "format": "uuid"
          },
          "courtName": {
            "type": "string"
          },
          "sportCategoryId": {
            "type": "string",
            "format": "uuid"
          },
          "sportName": {
            "type": "string"
          },
          "date": {
            "type": "string",
            "format": "date"
          },
          "fromPrice": {
            "type": "number",
            "minimum": 0
          },
          "currency": {
            "type": "string"
          },
          "availableSlots": {
            "type": "integer",
            "minimum": 1
          },
          "firstStartsAt": {
            "type": "string",
            "format": "date-time"
          },
          "firstEndsAt": {
            "type": "string",
            "format": "date-time"
          },
          "distanceKm": {
            "type": "number",
            "nullable": true,
            "minimum": 0
          }
        }
      },
      "DiscoverySearchResult": {
        "type": "object",
        "required": [
          "items",
          "truncated"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/DiscoveryResult"
            }
          },
          "truncated": {
            "type": "boolean",
            "description": "A scan/display limit was reached. Narrow the filters."
          }
        }
      },
      "DiscoverySearchResponse": {
        "type": "object",
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "$ref": "#/components/schemas/DiscoverySearchResult"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "PaymentReminderSelection": {
        "type": "object",
        "description": "Choose unique memberIds (1..50), or remindAll=true without memberIds. Server resolves amount, deadline and payment state. Self reminders excluded. Configured per-member cooldown plus payment lock prevents concurrent bursts; no Idempotency-Key required.",
        "properties": {
          "memberIds": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "remindAll": {
            "type": "boolean",
            "default": false
          }
        },
        "not": {
          "anyOf": [
            {
              "required": [
                "memberIds",
                "remindAll"
              ],
              "properties": {
                "remindAll": {
                  "enum": [
                    true
                  ]
                }
              }
            },
            {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "memberIds"
                    ]
                  },
                  {
                    "required": [
                      "remindAll"
                    ],
                    "properties": {
                      "remindAll": {
                        "enum": [
                          true
                        ]
                      }
                    }
                  }
                ]
              }
            }
          ]
        }
      },
      "PaymentReminderMemberResult": {
        "type": "object",
        "required": [
          "memberId",
          "outcome"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "outcome": {
            "type": "string",
            "enum": [
              "ACCEPTED",
              "SKIPPED"
            ]
          },
          "reason": {
            "type": "string",
            "nullable": true,
            "enum": [
              "SELF",
              "WINDOW_CLOSED",
              "NO_ALLOCATION",
              "PAID",
              "COOLDOWN",
              "NOT_MEMBER"
            ]
          },
          "lastReminderAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "nextReminderAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
      "PaymentReminderResult": {
        "type": "object",
        "required": [
          "acceptedCount",
          "skippedCount",
          "members"
        ],
        "properties": {
          "acceptedCount": {
            "type": "integer",
            "minimum": 0
          },
          "skippedCount": {
            "type": "integer",
            "minimum": 0
          },
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PaymentReminderMemberResult"
            }
          }
        }
      }
    }
  },
  "tags": [
    {
      "name": "Group Booking",
      "description": "Booking-owned groups and immutable VND allocations; contributions are paid in Payment Service."
    }
